services:
  postgres_pg:
    image: pgvector/pgvector:pg19-trixie
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB: Victorian_Rent_Laws
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql