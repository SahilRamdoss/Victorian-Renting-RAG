services:
  postgres_pg:
    image: pgvector/pgvector:pg19-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: victorian_rent_laws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d victorian_rent_laws"]
      interval: 5s
      retries: 10

  chatbot:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres_pg:5432/victorian_rent_laws
    depends_on:
      postgres_pg:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ingester:
    build: ./backend
    command: python -m app.workers.fetcher
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres_pg:5432/victorian_rent_laws
    depends_on:
      chatbot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: